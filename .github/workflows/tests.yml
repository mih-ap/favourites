name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # faster-whisper не нужен: в тестах ASR замокан, модель импортируется лениво
      - run: pip install "httpx>=0.28,<1" "yt-dlp>=2025.9.0" "trafilatura>=2.0,<3"
      - run: python -m unittest discover -s tests -v
