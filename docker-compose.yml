name: favourites

# Путь к Obsidian-vault на хосте и адрес веб-интерфейса задаются в .env
# (FAV_VAULT_DIR, FAV_BIND, FAV_PORT) — см. .env.example.

x-base: &base
  image: favourites:latest
  env_file: .env
  user: "1000:1000"
  restart: unless-stopped
  environment:
    # пути внутри контейнера не должны перетираться хост-значениями из .env
    FAV_VAULT: /vault
    FAV_DATA_DIR: /data
  volumes:
    - ${FAV_VAULT_DIR:-./vault}:/vault
    - ./data:/data

services:
  web:
    <<: *base
    build: .
    container_name: favourites-web
    command: python -m app.web
    ports:
      - "${FAV_BIND:-127.0.0.1}:${FAV_PORT:-8090}:8090"

  worker:
    <<: *base
    container_name: favourites-worker
    command: python -m app.worker

  bot:
    <<: *base
    container_name: favourites-bot
    command: python -m app.bot
    profiles: ["bot"]
